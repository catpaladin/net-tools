name: "Go Test"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v3
        with:
          go-version: "1.25.1"
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -cover ./...

